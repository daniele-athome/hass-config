# lovelace_gen
path: network
title: Rete
icon: mdi:lan
type: sections
max_columns: 2
sections:

  # Column 1
  - type: grid
    cards:

      - type: markdown
        content: >
          ## Router

      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: glance
          #title: "Ethernet"
          show_state: false
          columns: 5
        filter:
          include:
            - entity_id: 'binary_sensor.router_ether*'

      # apparentely entity cards cannot go below columns=6
      - type: entity
        entity: binary_sensor.internet
        icon: mdi:web
        grid_options:
          columns: 6
      - type: entity
        entity: sensor.router_wireless_clients
        icon: mdi:wifi
        grid_options:
          columns: 6
      - type: entity
        entity: sensor.router_temperature
        icon: mdi:thermometer
        grid_options:
          columns: 6
      - type: entity
        entity: sensor.router_cpu_load
        icon: mdi:speedometer
        grid_options:
          columns: 6

  # Column 2
  - type: grid
    cards:

      - type: markdown
        content: >
          ## Internet access

      - type: 'custom:button-card'
        entity: switch.domonet_internet_all
        name: Domonet
        icon: mdi:home-automation
        styles:
          card:
            - height: 100px
        state:
          - value: 'on'
            color: green

      - type: custom:auto-entities
        card:
          type: glance
          show_state: false
          state_color: green
          columns: 2
        filter:
          include:
            - entity_id: "switch.domonet_internet_device_*"
              options:
                tap_action:
                  action: call-service
                  service: switch.toggle
                  service_data:
                    entity_id: this.entity_id
