path: things
title: Oggetti
icon: mdi:cogs
type: sections
max_columns: 2
sections:

  # Column 1
  - type: grid
    cards:

      - type: markdown
        content: >
          ## Home Assistant

      - type: 'custom:bar-card'
        entities:
          - entity: sensor.disk_use_percent
          - entity: sensor.memory_use_percent
        columns: 2
        positions:
          icon: 'outside'
          indicator: 'inside'
          minmax: 'off'
          name: 'off'
          value: inside
        card_mod:
          style: |-
            :host {
              --bar-card-border-radius: 4px;
            }
            :host .card-content {
              padding: 6px 10px;
            }
            bar-card-value {
              font-size: 13px;
              font-weight: bold;
              text-shadow: 1px 1px #0008;
              margin-left: 4px !important;
            }
            bar-card-divider {
              display: none;
            }

      - type: 'custom:bar-card'
        entities:
          - entity: sensor.processor_use
            icon: 'mdi:cpu-64-bit'
          - entity: sensor.cputemp_scatola
            icon: 'mdi:thermometer'
        columns: 2
        positions:
          icon: 'outside'
          indicator: 'inside'
          minmax: 'off'
          name: 'off'
          value: inside
        card_mod:
          style: |-
            :host {
              --bar-card-border-radius: 4px;
            }
            :host .card-content {
              padding: 6px 10px;
            }
            bar-card-value {
              font-size: 13px;
              font-weight: bold;
              text-shadow: 1px 1px #0008;
              margin-left: 4px !important;
            }
            bar-card-divider {
              display: none;
            }

      - type: custom:bar-card
        entities:
          - entity: sensor.current_version
            name: Corrente
          - entity: sensor.latest_version
            name: Ultima
        columns: 2
        animation:
          state: 'off'
        positions:
          icon: 'off'
          indicator: 'off'
          minmax: 'off'
          name: inside
          value: inside
        height: '40px'
        card_mod:
          style: |-
            :host {
              --bar-card-border-radius: 4px;
            }
            :host .card-content {
              padding: 0 10px;
            }
            bar-card-card {
              padding: 9px;
            }
            bar-card-name {
              margin: 2px 0 0 0;
            }
            bar-card-value {
              font-weight: bold;
              margin-right: auto;
              margin-left: auto;
              margin-bottom: auto;
              margin-top: 0px;
            }
            bar-card-divider {
              display: none;
            }
            bar-card-contentbar {
              flex-direction: column !important;
            }

      - type: custom:button-card
        name: Upgrade Home Assistant
        icon: mdi:update
        layout: icon_name
        styles:
          card:
            - height: 70px
          name:
            - justify-self: start
        confirmation:
          text: "Home Assistant sarà aggiornato all'ultima versione."
        tap_action:
          action: call-service
          # TODO call docker upgrade service
          service: shell_command.upgrade_configuration_scm

      - type: custom:button-card
        name: Upgrade configuration
        icon: mdi:script-text-play
        layout: icon_name
        styles:
          card:
            - height: 70px
          name:
            - justify-self: start
        confirmation:
          text: 'Dopo aver aggiornare la configurazione, Home Assistant sarà riavviato.'
        tap_action:
          action: call-service
          service: script.hass_upgrade_config_and_restart

  # Column 2
  - type: grid
    cards:
      - type: markdown
        content: |-
          #### CONTROLLER

      - type: custom:bar-card
        entities:
          - entity: sensor.battery_scatola
            name: Scatola
          - entity: sensor.status_controlcenter
            name: Centro di controllo
          - entity: sensor.status_thermostat
            name: Termostato
          - entity: sensor.status_mediarasp
            name: Media center
        severity:
          - color: '#bf4040'
            from: 0
            to: 15
          - color: '#bf9540'
            from: 16
            to: 75
          - color: '#1db954'
            from: 76
            to: 100
        columns: 2
        positions:
          icon: 'off'
          indicator: 'off'
          minmax: 'off'
          name: 'inside'
          value: 'off'
        card_mod:
          style: |
            :host {
              --bar-card-border-radius: 4px;
            }
            :host .card-content {
              padding: 6px 10px;
            }
            bar-card-name {
              font-size: 13px;
              font-weight: bold;
              text-shadow: 1px 1px #0008;
              margin-left: auto;
              margin-right: auto;
            }
            bar-card-divider {
              display: none;
            }

      - type: markdown
        content: |-
          #### BATTERIE

      - type: custom:bar-card
        entities:
          # TODO use "battery_plus" entities from battery-notes
          - entity: sensor.battery_env_external
            name: 'Ambiente: Esterno'
          - entity: sensor.battery_env_living
            name: 'Ambiente: Soggiorno'
          - entity: sensor.battery_env_bedroom
            name: 'Ambiente: Camera'
          - entity: sensor.battery_env_bathroom1
            name: 'Ambiente: Bagno 1'
          - entity: sensor.battery_env_kitchen
            name: 'Ambiente: Cucina'
          - entity: sensor.battery_env_studio
            name: 'Ambiente: Studio'
          - entity: sensor.battery_door_main
            name: 'Porta: Entrata'
          - entity: sensor.battery_lux_living
            name: 'Lux: Soggiorno'
          - entity: sensor.battery_motion_entrance
            name: 'Movimento: Ingresso'
          - entity: sensor.battery_motion_bedroom_left
            name: 'Movimento: Camera (sx)'
          - entity: sensor.battery_motion_bedroom_headrest
            name: 'Movimento: Camera (letto)'
          - entity: sensor.battery_env_bathroom1_shower
            name: 'Ambiente: Bagno 1 (doccia)'
          #- entity: sensor.battery_water_bathroom1
          #  name: 'Acqua: Bagno 1'
        severity:
          - color: '#bf4040'
            from: 0
            to: 15
          - color: '#bf9540'
            from: 16
            to: 75
          - color: '#1db954'
            from: 76
            to: 100
        columns: 2
        positions:
          icon: 'off'
          indicator: 'off'
          minmax: 'off'
          name: 'inside'
          value: 'off'
        card_mod:
          style: |
            :host {
              --bar-card-border-radius: 4px;
            }
            :host .card-content {
              padding: 6px 10px;
            }
            bar-card-name {
              font-size: 13px;
              font-weight: bold;
              text-shadow: 1px 1px #0008;
              margin-left: auto;
              margin-right: auto;
            }
            bar-card-divider {
              display: none;
            }

      - type: markdown
        content: |-
          #### LUCI

      - type: custom:auto-entities
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - entity_id: light.*
              options:
                type: custom:button-card
                section_mode: true
                layout: icon_name
                styles:
                  name:
                    - font-size: 0.9em
                    - justify-self: start
          exclude:
            - entity_id: light.browser_mod_*
            - entity_id: light.*_real
            - entity_id: light.all*
            - entity_id: light.*voice*
            - entity_id: light.*dial*
            - hidden_by: user
        sort:
          method: friendly_name

      - type: custom:browser-control-card
        controls:
          - fullscreen
          - reload
          - navbar
          - sidebar
        no_padding: false
        small_buttons: false
        layout: center
