language: it

intents:

  CalendarSummaryToday:
    data:
      - sentences:
          - "[(mi dici|dimmi)] (che|cosa) (succede|devo fare) oggi"
          - "[(mi dici|dimmi)] (gli appuntamenti|il calendario) [(per|di)] oggi"
          - "[(mi dici|dimmi)] che appuntamenti (ci sono|ho) [(per oggi|oggi)]"
          - "[(mi dici|dimmi)] (che|cosa) c'è (in|nel) calendario [oggi]"

  CalendarSummaryTomorrow:
    data:
      - sentences:
          - "[(mi dici|dimmi)] (che|cosa) (succede|devo fare) domani"
          - "[(mi dici|dimmi)] (gli appuntamenti|il calendario) [(per|di)] domani"
          - "(mi dici|dimmi) che appuntamenti (ci sono|ho) [per] domani"
          - "[(mi dici|dimmi)] (che|cosa) c'è (in|nel) calendario domani"
          - "[(mi dici|dimmi)] cosa ho (in|nel) calendario [(per|di)] domani"

  CalendarSummaryWeekend:
