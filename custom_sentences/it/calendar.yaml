          - "che appuntamenti (ci sono|ho) [(per|il|nel)] (fine settimana|weekend)"
          - "(che|cosa) devo fare [(il|nel)] (fine settimana|weekend)"
          - "(che|cosa) c'è (in|nel) calendario [(il|nel)] (fine settimana|weekend)"
