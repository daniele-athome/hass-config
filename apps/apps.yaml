# Applications

app_domonet_manager:
  module: domonet_manager
  class: DomonetManager
  plugin: HASS
  log: domonet
  log_level: DEBUG
  domonet_interface: !secret domonet_interface
  external_interface: !secret external_interface
  check_global_command: sudo bin/domonet_check_global.sh
  enable_global_command: sudo bin/domonet_allow_global.sh
  disable_global_command: sudo bin/domonet_disallow_global.sh
  device_list_command: bin/domonet_clients.sh
  #device_list_command: apps/test/domonet_clients.sh
  check_device_command: sudo bin/domonet_check_device.sh
  enable_device_command: sudo bin/domonet_allow_device.sh
  disable_device_command: sudo bin/domonet_disallow_device.sh
