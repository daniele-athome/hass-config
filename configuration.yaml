      - binary_sensor.door_main
      - binary_sensor.motion_living_door
      - binary_sensor.living_main_motion
      - binary_sensor.living_entrance_motion
      - binary_sensor.internet
      - sensor.router_wireless_clients
      - sensor.router_temperature
      # TEST media player >>>
      - media_player.tv
      - media_player.kodi
      - media_player.music
      # <<< TEST
      - sensor.speedtest_download
      - sensor.speedtest_ping
      - sensor.speedtest_upload
      - input_text.vacuum_finished_room
    entity_globs:
      - input_number.energy_*
      - sensor.energy_*
      - sensor.power_*
      - light.*
      - sensor.battery_*
      - climate.*
      - person.*
      - sensor.yaris_*
      - binary_sensor.yaris_*
      - device_tracker.yaris_*
      - sensor.temperature_*
      - sensor.humidity_*
      - sensor.pressure_*
      - sensor.lux_*
      - binary_sensor.occupancy_*
      - binary_sensor.activity_*
      - sensor.activity_*

# Prometheus metrics endpoint
prometheus:
  namespace: hass

# Track the sun
sun:

# Text to speech
tts:
  - platform: amazon_polly
    voice: Bianca
    region_name: eu-west-3
    text_type: ssml
    aws_access_key_id: !secret aws_tts_access_key_id
    aws_secret_access_key: !secret aws_tts_secret_access_key
