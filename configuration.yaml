zha:
  database_path: /config/zigbee.db
  zigpy_config:
    ota:
      # https://github.com/zigpy/zha-device-handlers/issues/2476#issuecomment-2598382464
      extra_providers:
        - type: z2m
      otau_directory: /config/zigpy_ota

system_health:
